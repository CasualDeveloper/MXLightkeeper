name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 on macOS 15
        if: matrix.runner == 'macos-15'
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Select default Xcode on latest macOS
        if: matrix.runner == 'macos-latest'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
